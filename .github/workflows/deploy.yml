name: Deploy Castiel Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check HTML/CSS/JS files exist
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/fractal.js
          test -f js/tesseract.js
          test -f js/sections.js
          test -f js/player.js
          test -f js/app.js
          test -f music/manifest.json
          test -f code/manifest.json
          echo "All required files present."

      - name: Validate JSON manifests
        run: |
          python3 -c "import json,sys; json.load(open('music/manifest.json'))" && echo "music/manifest.json OK"
          python3 -c "import json,sys; json.load(open('code/manifest.json'))" && echo "code/manifest.json OK"

  deploy:
    name: Deploy
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::828788451819:role/github-actions-castiel-role
          aws-region: ap-southeast-1

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://castiel-engle-com \
            --exclude "infra/*" \
            --exclude ".github/*" \
            --exclude "*.sh" \
            --exclude ".git/*" \
            --exclude "CLAUDE.md" \
            --exclude "music/*.mp3" \
            --exclude "music/*.wav" \
            --exclude "music/*.pdf" \
            --exclude "code/*.py" \
            --exclude "assets/images/*" \
            --exclude "*.zip" \
            --delete \
            --cache-control "max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name castiel-engle-com \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
